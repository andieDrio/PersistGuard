name: Verify PersistGuard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: persistguard
          POSTGRES_PASSWORD: persistguard_ci_only
          POSTGRES_DB: persistguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persistguard -d persistguard_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PERSISTGUARD_DATABASE_URL: postgresql+psycopg://persistguard:persistguard_ci_only@localhost:5432/persistguard_test
      PERSISTGUARD_TEST_DATABASE_URL: postgresql+psycopg://persistguard:persistguard_ci_only@localhost:5432/persistguard_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - name: Verify Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = 'v0.0.0-ci'
          $output = Join-Path $env:RUNNER_TEMP 'persistguard-release'
          $release = ./build-windows-release.ps1 -Version $version -OutputDirectory $output -Unsigned
          $zipName = "persistguard-agent-$version-windows-amd64-unsigned.zip"
          $zip = Join-Path $release.FullName $zipName
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -Raw -LiteralPath (Join-Path $release.FullName 'SHA256SUMS.txt')).Trim() -cne "$hash  $zipName") {
            throw 'Windows release checksum does not match the ZIP.'
          }
          $extracted = Join-Path $output 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted
          $agent = Join-Path $extracted 'persistguard-agent.exe'
          $reportedVersion = & $agent --version
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne $version) { throw 'Unexpected Windows release version.' }
      - name: Verify Windows service upgrade and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-service-update.ps1

  gateway:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: persistguard
          POSTGRES_PASSWORD: persistguard_ci_only
          POSTGRES_DB: persistguard_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persistguard -d persistguard_gateway_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PERSISTGUARD_DATABASE_URL: postgresql+psycopg://persistguard:persistguard_ci_only@localhost:5432/persistguard_gateway_test
      PERSISTGUARD_GATEWAY_TEST_DATABASE_URL: postgresql://persistguard:persistguard_ci_only@localhost:5432/persistguard_gateway_test?sslmode=disable
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
        working-directory: .
      - run: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head
        working-directory: .
      - run: go test -v ./...

  dashboard:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
