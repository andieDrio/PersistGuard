name: Verify PersistGuard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: persistguard
          POSTGRES_PASSWORD: persistguard_ci_only
          POSTGRES_DB: persistguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persistguard -d persistguard_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PERSISTGUARD_DATABASE_URL: postgresql+psycopg://persistguard:persistguard_ci_only@localhost:5432/persistguard_test
      PERSISTGUARD_TEST_DATABASE_URL: postgresql+psycopg://persistguard:persistguard_ci_only@localhost:5432/persistguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend alembic -c backend/alembic.ini upgrade head
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go test ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
